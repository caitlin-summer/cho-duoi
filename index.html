<style>
:root{--ink:#6b4433;--txt:#5a3a2e;--top:#bfe9ff;--card:#fffaf0;--pink:#ff8fb8;--chip:#ffffffd9;--bot:#a9a9ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--txt:#fbeee6;--top:#2b2f66;--card:#3b3355;--chip:#3b3355d9;--bot:#3a3550}}
:root[data-theme="dark"]{--txt:#fbeee6;--top:#2b2f66;--card:#3b3355;--chip:#3b3355d9;--bot:#3a3550}
html,body{height:100%;margin:0}
body{font-family:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;color:var(--txt);background:var(--bot)}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--top)}
.logo{font-size:32px}h1{font-size:clamp(17px,3vw,26px);margin:0;line-height:1.1}#cnt{margin:0;font-size:14px;opacity:.85}
.hb{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:700;color:var(--txt);cursor:pointer}
.sm{background:var(--chip);border:2px solid var(--ink);border-radius:999px;padding:5px 12px}
footer{padding:8px 14px 10px;background:var(--bot);display:flex;justify-content:center}
.big{background:var(--pink);color:#fff;border:3px solid var(--ink);border-bottom-width:7px;border-radius:20px;padding:10px 28px;font-size:clamp(18px,3vw,24px)}
.big:active{transform:translateY(3px);border-bottom-width:4px}.big:disabled{opacity:.6}
#st{flex:1;position:relative;overflow:hidden;z-index:0;background:linear-gradient(#6fc0ff,#d6f0ff 34%);--a:-3px}
.bld{position:absolute;left:0;right:0;top:16%;height:38%;background:repeating-linear-gradient(90deg,#ffd77a 0 14%,#ffc4c4 14% 28%,#bfe0ff 28% 42%,#ffe6b0 42% 56%,#c9f0d8 56% 70%,#ffd0a8 70% 84%,#e2d4ff 84% 100%)}
.bld::before{content:"";position:absolute;inset:12% 0 38% 0;background:repeating-linear-gradient(90deg,transparent 0 3%,#5b9bd8 3% 8%,transparent 8% 14%);opacity:.75}
.bld::after{content:"";position:absolute;left:0;right:0;bottom:26%;height:14%;background:repeating-linear-gradient(90deg,#ef5350 0 18px,#fff 18px 36px)}
.walk{position:absolute;left:0;right:0;top:54%;height:8%;background:#e9d5b2;border-bottom:3px solid #cdb68e}
.road{position:absolute;left:0;right:0;top:62%;bottom:0;background:linear-gradient(#a5acb3,#8c939a);border-top:4px solid #7d848b}#bg{position:absolute;left:0;top:0;width:100%;height:62%}
.cl{position:absolute;font-size:48px;font-style:normal;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(110vw)}}
.tree{position:absolute;left:1%;top:6%;font-size:clamp(90px,17vw,210px);font-style:normal;line-height:1}
.pl{position:absolute;left:0;bottom:0;width:clamp(90px,15vw,210px);z-index:1900;pointer-events:none}
.a{position:absolute;left:0;top:0;will-change:transform;transition:opacity .4s}
.a::before{content:"";position:absolute;left:10%;right:10%;bottom:-4px;height:10px;background:#0003;border-radius:50%}
.box{animation:hop 1s ease-in-out infinite alternate}
#st.chase{--a:-14px}#st.chase .box{animation-duration:.12s}
.h .box{--a:-16px;animation-duration:.4s}
@keyframes hop{to{transform:translateY(var(--a))}}
.fl svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes lg{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}@keyframes wag{to{transform:rotate(18deg)}}
.l1,.l2{animation:lg .55s ease-in-out infinite alternate}.l2{animation-direction:alternate-reverse}
#st.chase .l1,#st.chase .l2{animation-duration:.13s}.h .l1,.h .l2{animation:none}
#st.chase .dl{animation:lg .18s ease-in-out infinite alternate}#st.chase .dr{animation:lg .18s ease-in-out infinite alternate-reverse}
.hp .tl{animation:wag .25s ease-in-out infinite alternate}
.tag{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);white-space:nowrap;background:var(--chip);color:var(--txt);border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.h .tag{background:#ffe27a;color:#5a3a2e}
.zz{display:none;position:absolute;right:4%;top:-26%;font-style:normal;font-size:26px;animation:hop 1s ease-in-out infinite alternate}.sl .zz{display:block}
.jk{position:absolute;font-style:normal;z-index:1}
#bub{position:absolute;z-index:2000;transform:translate(-50%,-100%);background:#fff;color:#5a3a2e;border:3px solid var(--ink);border-radius:18px;padding:3px 14px;font-weight:800;font-size:clamp(14px,2.4vw,22px);white-space:nowrap;display:none}
#bub::after{content:"";position:absolute;left:50%;bottom:-13px;border:8px solid transparent;border-top-color:var(--ink);transform:translateX(-50%)}
#res{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:2000;display:none;text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:4px 24px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
#res.on{display:block}#res small{font-size:14px;color:#e2527f;font-weight:800}#resN{display:block;font-size:clamp(28px,7vw,48px);line-height:1.1;font-weight:800}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.ov{position:fixed;inset:0;background:#3a1f2a88;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}.ov.on{display:flex}
.card{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:20px 24px;max-width:420px;width:100%;text-align:center;max-height:92%;overflow:auto}
.link{background:none;border:0;text-decoration:underline;margin-top:10px;display:block;width:100%}
textarea{width:100%;height:200px;border:2px solid var(--ink);border-radius:14px;padding:10px;font:inherit;background:var(--chip);color:var(--txt);box-sizing:border-box}
label{display:flex;gap:8px;align-items:center;margin:8px 0;text-align:left}
#msg{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:2000;font-size:clamp(20px,4vw,32px);font-weight:800;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 10px var(--ink);display:none;text-align:center}
.dust{position:absolute;font-style:normal;z-index:1;pointer-events:none;animation:dust .55s ease-out forwards}
@keyframes dust{from{opacity:.9;transform:scale(.5)}to{opacity:0;transform:translate(var(--dx,-20px),-10px) scale(1.6)}}
#spd{position:absolute;inset:0;z-index:1800;pointer-events:none;display:none;opacity:.55;background:repeating-linear-gradient(0deg,transparent 0 22px,#fff9 22px 24px,transparent 24px 52px);background-size:240px 100%;animation:spd .25s linear infinite}
#st.chase #spd{display:block}
@keyframes spd{to{background-position:-240px 0}}
#st.chase #bg{animation:shk .14s linear infinite}
@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-2px,-1px)}100%{transform:translate(0,0)}}
#st.chase .tag{background:#ffd0d0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx i{position:absolute;top:-14px;width:10px;height:14px;border-radius:3px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}

<script>
const $=s=>document.querySelector(s),F=$("#st"),O="#4a3430";
const rnd=(a,b)=>a+Math.random()*(b-a),wait=ms=>new Promise(r=>setTimeout(r,ms));
function kidSVG(i,m){
 const sk=["#ffdcc0","#f9cfa8","#f1bb8c","#fbd3c4"][i%4],hr=["#2b2230","#3b2a24","#5a3a28","#1f2a44","#6b2f3a","#2b2230","#d9763b","#7a5cff"][(i*3+(i/8|0))%8],g=i%3==2,gl=i%2==0,cap=!g&&i%7==1,ac=["#ff6fa5","#5aa9ff","#ffb02e","#7bd88f","#b48cff"][i%5],st=`stroke="${O}" stroke-width="2.4"`,sh="#0000001a";

 [[28,19,"l1"],[42,33,"l2"]].forEach(([c,x,k])=>s+=`<g class="${k}" style="transform-origin:${c}px 68px"><rect x="${c-4}" y="66" width="8" height="24" rx="4" fill="${sk}" ${st}/><path d="M${c+1} 70v18" stroke="${sh}" stroke-width="3"/><path d="M${x} 91q9-3 17 0q0 6-8 6q-9 0-9-6z" fill="#3d7be0" ${st}/><path d="M${x+3} 92q6-3 11 0" stroke="#fff" stroke-width="1.6" fill="none"/></g>`);
 s+=g?`<path d="M16 80L21 58H49L54 80Z" fill="#2d4a94" ${st}/><path d="M28 60l-3 20M35 60v20M42 60l3 20" stroke="#ffffff30" stroke-width="1.6"/>`:`<path d="M20 58H50L53 78H38L35 71L32 78H17Z" fill="#2d4a94" ${st}/><path d="M23 62v10" stroke="#ffffff30" stroke-width="2"/>`;

 if(g)s+=`<circle cx="57" cy="17" r="7.5" fill="${hr}" ${st}/><path d="M60 23q5 10 1 17" stroke="${O}" stroke-width="9" fill="none"/><path d="M60 23q5 10 1 17" stroke="${hr}" stroke-width="5.5" fill="none"/>`;

 else s+=`<ellipse cx="27" cy="29" rx="2.5" ry="3.1" fill="${O}"/><ellipse cx="43" cy="29" rx="2.5" ry="3.1" fill="${O}"/><circle cx="27.9" cy="27.9" r="1" fill="#fff"/><circle cx="43.9" cy="27.9" r="1" fill="#fff"/><path d="M22 23q4-2.5 8 0M40 23q4-2.5 8 0" fill="none" stroke="${O}" stroke-width="1.8"/><path d="M33 34h4" stroke="${sh}" stroke-width="1.6"/><path d="M31 38q4 3 8 0" fill="none" ${st}/><ellipse cx="21" cy="34" rx="4" ry="2.6" fill="#ff8fa3" opacity=".55"/><ellipse cx="49" cy="34" rx="4" ry="2.6" fill="#ff8fa3" opacity=".55"/><path d="M10 3q5 8 0 12q-5-4 0-12z" fill="#7cc8ff" stroke="#3b8fd0" stroke-width="1.2"/><circle cx="9" cy="9" r="1.2" fill="#fff"/>`;

 s+=`<path d="M81 24L77 3L98 14ZM110 18L125 4L122 30Z" fill="${d}" ${st}/><path d="M82 20L80 9L91 15ZM112 19L120 10L119 25Z" fill="#c98a6a"/><circle cx="98" cy="40" r="23" fill="${d}" ${st}/><path d="M84 26Q98 16 112 24" stroke="${d2}" stroke-width="4" fill="none"/><ellipse cx="88" cy="50" rx="6" ry="4.5" fill="${t}"/><ellipse cx="111" cy="48" rx="12" ry="10" fill="${t}" ${st}/><ellipse cx="120" cy="42" rx="5" ry="3.6" fill="#1c1820" ${st}/><circle cx="121" cy="41" r="1.2" fill="#fff"/><ellipse cx="91" cy="29" rx="3.2" ry="2.2" fill="${t}"/><ellipse cx="105" cy="29" rx="3.2" ry="2.2" fill="${t}"/>`;
 s+=`<path d="M82 54q14 13 29 0" stroke="${O}" stroke-width="8" fill="none"/><path d="M82 54q14 13 29 0" stroke="#e53935" stroke-width="5" fill="none"/><circle cx="97" cy="64" r="5" fill="#f7b731" ${st}/><path d="M95 64h4" stroke="${O}" stroke-width="1.4"/>`;
 if(m=="sleep")s+=`<path d="M88 38q4 3.5 8 0M102 38q4 3.5 8 0M108 54q4 2 8 0" fill="none" ${st}/><path d="M118 56q-2 6 0 9" stroke="#7cc8ff" stroke-width="3" fill="none"/>`;
 else if(m=="angry")s+=`<circle cx="92" cy="38" r="4.2" fill="#fff" ${st}/><circle cx="106" cy="38" r="4.2" fill="#fff" ${st}/><circle cx="93" cy="39" r="2.2" fill="#000"/><circle cx="105" cy="39" r="2.2" fill="#000"/><path d="M85 28l12 6M113 28l-12 6" fill="none" stroke="${O}" stroke-width="3.4"/><path d="M104 53q8-3 15 0l-2 6-3-3-3 3-3-3z" fill="#fff" ${st}/><path d="M122 36q4 0 5 3" stroke="${O}" stroke-width="1.6" fill="none"/>`;
 else if(m=="happy")s+=`<path d="M88 38q4-5 8 0M102 38q4-5 8 0" fill="none" ${st}/><ellipse cx="112" cy="59" rx="5" ry="6.5" fill="#ff7a93" ${st}/><path d="M104 53q8 4 14 0" fill="none" ${st}/>`;
 else s+=`<circle cx="92" cy="38" r="3.2" fill="${O}"/><circle cx="106" cy="38" r="3.2" fill="${O}"/><circle cx="93" cy="37" r="1" fill="#fff"/><circle cx="107" cy="37" r="1" fill="#fff"/><path d="M107 54q4 2 8 0" fill="none" ${st}/>`;

let AC,master,musG,mTimer=0,mStep=0,SD=.3;
const mid=m=>440*Math.pow(2,(m-69)/12),MEL=[72,0,76,0,79,0,76,0,74,0,77,0,81,0,77,0,76,0,79,0,84,0,79,0,77,0,74,0,72,0,0,0],BASS=[48,53,45,55];
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);musG=AC.createGain();musG.gain.value=.25;musG.connect(master)}catch(e){return null}}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,t,d,type,v,dest,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05)}
function music(on){clearInterval(mTimer);mTimer=0;if(!on||!ac())return;let next=AC.currentTime+.1;mTimer=setInterval(()=>{while(next<AC.currentTime+.4){const k=mStep%32,m=MEL[k];if(m)tone(mid(m),next,SD*.9,"triangle",.9,musG);if(k%8==0)tone(mid(BASS[k>>3]),next,SD*7,"sine",1,musG);next+=SD;mStep++}},100)}
function duck(d){if(AC&&musG)musG.gain.setTargetAtTime(d?.07:.25,AC.currentTime,.2)}
function sfx(k){if(!opts.sfx||!ac())return;const t=AC.currentTime;
 if(k=="squeak"){tone(900,t,.12,"sine",.35,0,1700);tone(1200,t+.14,.1,"sine",.35,0,2000)}
 if(k=="bark"){tone(320,t,.15,"sawtooth",.25,0,140);tone(340,t+.22,.15,"sawtooth",.25,0,150)}
 if(k=="step")tone(130,t,.07,"sine",.4,0,60);
 if(k=="win")[72,76,79,84,88].forEach((m,i)=>tone(mid(m),t+i*.09,.5,"triangle",.3))}
function pickVoice(l){try{const b=l.slice(0,2),vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(b));let best=null,bs=-1;vs.forEach(v=>{let s=0;if(/natural|neural|online/i.test(v.name))s+=10;if(/google/i.test(v.name))s+=6;if(/premium|enhanced|siri|samantha|aria|jenny|hoaimy|linh/i.test(v.name))s+=5;if(v.lang.replace("_","-").toLowerCase()===l.toLowerCase())s+=2;if(s>bs){bs=s;best=v}});return best}catch(e){return null}}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=/^[A-Za-z0-9 .'’\-]+$/.test(t.trim())?"en-US":"vi-VN";const v=pickVoice(u.lang);if(v){u.voice=v;u.lang=v.lang}u.rate=.92;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
function confetti(){const c=["#ff6fa5","#ffd23f","#6ee7b7","#7cc4ff","#c4a1ff"],fx=$("#fx");for(let k=0;k<40;k++){const d=document.createElement("i");d.style.cssText=`left:${Math.random()*100}%;background:${c[k%5]};--dx:${(Math.random()-.5)*200}px;animation-delay:${Math.random()*.4}s`;fx.appendChild(d);setTimeout(()=>d.remove(),2800)}}

let names=[],kids=[],dog,called=new Set(),phase="sneak",chosen=null,chaseT=0,sdT=0,junk=[],kw=70,kh=107,dw=160,dh=100,opts={norepeat:true,sound:true,music:true,sfx:true};
function load(){try{const s=JSON.parse(localStorage.getItem("cho-goi-ten")||"null");if(s&&s.names&&s.names.length){names=s.names;opts=Object.assign(opts,s.opts);called=new Set(s.called||[])}}catch(e){}
 if(!names.length)names=Array.from({length:12},(_,i)=>"Học sinh "+String(i+1).padStart(2,"0"))}
function save(){try{localStorage.setItem("cho-goi-ten",JSON.stringify({names,opts,called:[...called]}))}catch(e){}}
function cnt(){$("#cnt").textContent="Đã gọi "+called.size+" / "+names.length+" bạn"}
function label(){$("#bMus").textContent=opts.music?"🎵 Nhạc":"🔇 Nhạc"}
function say(t,ms){const m=$("#msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",ms)}
function bub(t){const b=$("#bub");b.textContent=t;b.style.display=t?"block":"none"}
function tgt(s){const W=F.clientWidth,H=F.clientHeight;s.tx=rnd(kw/2,W-kw/2);s.ty=rnd(H*.62,H-6)}
function home(){return{x:Math.max(dw/2+8,F.clientWidth*.15),y:F.clientHeight-8}}
function setMood(k,m){if(k.mood!==m){k.mood=m;k.fl.innerHTML=kidSVG(k.i,m)}}
function setDog(m){dog.mood=m;dog.fl.innerHTML=dogSVG(m);dog.el.classList.toggle("sl",m=="sleep");dog.el.classList.toggle("hp",m=="happy")}
function mk(cls,w,h){const el=document.createElement("div");el.className="a "+cls;el.style.width=w+"px";el.innerHTML='<div class="box"><div class="fl"></div></div>';F.appendChild(el);return{el,fl:el.querySelector(".fl"),w,h,f:1,pause:0,age:0}}
function clearJunk(){junk.forEach(e=>e.remove());junk=[]}
function build(){
 F.querySelectorAll(".a").forEach(e=>e.remove());clearJunk();
 const W=F.clientWidth,H=F.clientHeight;kw=Math.max(40,Math.min(96,125-names.length*2.4,W/7.5));kh=kw*1.43;dw=kw*2.3;dh=dw*82/130;
 kids=names.map((n,i)=>{const s=mk("k",kw,kh);s.i=i;s.sp=rnd(14,26);s.fs=rnd(150,200);s.mood="";setMood(s,"calm");
  const t=document.createElement("div");t.className="tag";t.textContent=n;s.el.appendChild(t);tgt(s);s.x=s.tx;s.y=s.ty;tgt(s);
  if(called.has(i)&&opts.norepeat){s.gone=1;s.el.style.display="none"}return s});
 dog=mk("dg",dw,dh);dog.el.insertAdjacentHTML("beforeend",'<i class="zz">💤</i>');const h=home();dog.x=h.x;dog.y=h.y;dog.m="sleep";setDog("sleep");
 phase="sneak";chosen=null;bub("Suỵt… nhẹ thôi!");$("#res").classList.remove("on");F.classList.remove("chase");cnt()}
function mv(s,tx,ty,sp,dt){const dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy);if(d<3)return 0;const m=Math.min(d,sp*dt);s.x+=dx/d*m;s.y+=dy/d*m;if(Math.abs(dx)>3)s.f=dx<0?-1:1;return d-m}
function steer(s,sp,dt,fx,fy){const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy)||1;let vx=dx/d,vy=dy/d;const a=kw*.8,b=kw*.45;
 kids.forEach(o=>{if(o===s||o.gone)return;const ex=s.x-o.x,ey=s.y-o.y,nd=Math.hypot(ex/a,ey/b);if(nd<1.8&&nd>0){const w=(1.8-nd)*2.4,e=Math.hypot(ex,ey)||1;vx+=ex/e*w;vy+=ey/e*w}});
 vx+=fx;vy+=fy;const l=Math.hypot(vx,vy)||1;s.x+=vx/l*sp*dt;s.y+=vy/l*sp*dt;if(Math.abs(vx)>.15)s.f=vx<0?-1:1}
function sep(){const A=kids.filter(k=>!k.gone),a=kw*.75,b=kw*.4;
 for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){const p=A[i],q=A[j],ex=p.x-q.x,ey=p.y-q.y,nd=Math.hypot(ex/a,ey/b);
  if(nd<1){const e=Math.hypot(ex,ey)||1,ux=(ex||rnd(-1,1))/e,uy=ey/e,push=(1-nd)*kw*.3,wp=p.h?0:1,wq=q.h?0:1,t=(wp+wq)||1;p.x+=ux*push*2*wp/t;p.y+=uy*push*2*wp/t;q.x-=ux*push*2*wq/t;q.y-=uy*push*2*wq/t}}}
let last=0,stepT=0,dustT=0,barkT=0;
function dust(s,big){if(!s)return;const e=document.createElement('i');e.className='dust';e.textContent='💨';e.style.cssText=`left:${s.x-s.f*s.w*.45}px;top:${s.y-s.h*.2}px;font-size:${s.w*.45}px;--dx:${-s.f*30}px`;F.appendChild(e);setTimeout(()=>e.remove(),600)}

function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;const W=F.clientWidth,H=F.clientHeight;
 if(phase=="chase"){chaseT+=dt;sdT+=dt;stepT+=dt;dustT+=dt;barkT+=dt;
  if(stepT>.2){stepT=0;sfx("step")}
  if(barkT>1.3){barkT=0;sfx("bark")}
  if(dustT>.1){dustT=0;const r=kids.filter(k=>!k.gone);for(let n=0;n<4&&r.length;n++)dust(r[Math.random()*r.length|0]);dust(chosen);dust(dog,1)}if(sdT>.35){sdT=0;const r=kids.filter(k=>!k.gone);if(r.length&&junk.length<18){const k=r[Math.random()*r.length|0],e=document.createElement("i");e.className="jk";e.textContent="🩴";e.style.cssText=`left:${k.x}px;top:${k.y-14}px;transform:rotate(${rnd(-90,90)}deg);font-size:${kw*.4}px`;F.appendChild(e);junk.push(e)}}}
 kids.forEach(k=>{if(k.gone)return;
  if(phase=="result"&&k===chosen){mv(k,k.tx,k.ty,420,dt)}
  else if(phase=="chase"){const d=Math.hypot(k.tx-k.x,k.ty-k.y);k.age+=dt;if(d<10||k.age>2.5){tgt(k);k.age=0}
   const ex=k.x-dog.x,ey=k.y-dog.y,dd=Math.hypot(ex,ey)||1,R=kw*5,w=dd<R?(1-dd/R)*3:0;
   steer(k,k===chosen?Math.max(70,k.fs*(1-chaseT*.07)):k.fs,dt,ex/dd*w,ey/dd*w)}
  else{if(k.pause>0)k.pause-=dt;else if(Math.hypot(k.tx-k.x,k.ty-k.y)<4){tgt(k);k.pause=rnd(.4,2.2)}else steer(k,k.sp,dt,0,0)}
  k.x=Math.max(kw/2,Math.min(W-kw/2,k.x));k.y=Math.max(H*.62,Math.min(H-6,k.y))});
 sep();
 if(dog){if(dog.m=="chase"&&chosen){const k=chosen,dx=k.x-dog.x,dy=k.y-dog.y,d=Math.hypot(dx,dy)||1,z=Math.sin(chaseT*6)*.5;
   const ds=170+Math.min(chaseT,3.5)*35;dog.x+=(dx/d-dy/d*z)*ds*dt;dog.y+=(dy/d+dx/d*z)*ds*dt;dog.f=dx<0?-1:1;dog.y=Math.max(H*.62,Math.min(H-6,dog.y));
   if(d<kw*.9||chaseT>9)catchIt()}
  else if(dog.m=="home"){const h=home();if(!mv(dog,h.x,h.y,700,dt)){dog.m="sleep";setDog("sleep");bub("Suỵt… nhẹ thôi!")}}
  else if(dog.m=="happy")mv(dog,dog.tx,dog.ty,420,dt);
  $("#bub").style.left=dog.x+"px";$("#bub").style.top=(dog.y-dh-4)+"px"}
 kids.concat(dog?[dog]:[]).forEach(s=>{if(s.gone)return;s.el.style.transform=`translate(${s.x-s.w/2}px,${s.y-s.h}px)`;s.el.style.zIndex=Math.round(s.y);s.fl.style.transform=`scaleX(${s.f}) rotate(${phase=="chase"?(s===dog?9:12):0}deg)`});
 requestAnimationFrame(loop)}
function catchIt(){if(phase!="chase")return;phase="result";SD=.3;F.classList.remove("chase");const k=chosen,W=F.clientWidth,H=F.clientHeight;
 k.h=1;k.el.classList.add("h");setMood(k,"happy");k.tx=Math.max(kw,Math.min(W-dw-kw,W*.45));k.ty=H*.8;
 dog.m="happy";setDog("happy");dog.tx=k.tx+kw*.5+dw*.45;dog.ty=k.ty;dog.f=-1;
 kids.forEach(o=>{if(o!==k&&!o.gone){setMood(o,"calm");o.pause=rnd(0,1);tgt(o)}});
 called.add(k.i);save();cnt();bub("Bắt được rồi! Gâu!");$("#resN").textContent=names[k.i];$("#res").classList.add("on");
 sfx("win");confetti();duck(1);const nm=names[k.i];setTimeout(()=>{if(opts.sound&&phase=="result"&&chosen===k)speak("Bạn "+nm+" chạy chậm nhất. Mời trả lời bài")},700);$("#bGo").disabled=false}
function leave(k){k.h=0;k.el.classList.remove("h");if(opts.norepeat){k.gone=1;k.el.style.opacity=0;setTimeout(()=>{if(k.gone)k.el.style.display="none"},450)}else tgt(k)}
async function go(){
 if(phase=="wake"||phase=="chase")return;
 const pool=names.map((_,i)=>i).filter(i=>!opts.norepeat||!called.has(i));
 if(!pool.length){say("Cả lớp được gọi hết rồi! Bấm “Làm lại vòng” nhé 🎉",2600);return}
 const prev=phase=="result";$("#bGo").disabled=true;$("#res").classList.remove("on");duck(0);try{speechSynthesis.cancel()}catch(e){}
 clearJunk();
 if(prev){if(chosen)leave(chosen);kids.forEach(k=>setMood(k,"calm"));dog.m="home";setDog("calm");dog.f=1;phase="sneak";bub("Suỵt… nhẹ thôi!");await wait(1700)}else await wait(300);
 phase="wake";sfx("bark");bub("Gâu gâu gâu!! Chạy đi!!");setDog("angry");
 
 await wait(600);
 const r=pool.filter(i=>!kids[i].gone);chosen=kids[r[Math.random()*r.length|0]];chaseT=0;sdT=0;phase="chase";SD=.15;F.classList.add("chase");dog.m="chase";
 kids.forEach(k=>{if(!k.gone){setMood(k,"cry");k.age=0;k.fs=rnd(210,270);tgt(k)}});chosen.fs=rnd(135,150);sfx("bark")}
$("#bGo").onclick=go;
$("#bMus").onclick=()=>{opts.music=!opts.music;save();label();music(opts.music)};
$("#bRe").onclick=()=>{called.clear();save();build()};
$("#bSet").onclick=()=>{$("#ta").value=names.join("\n");$("#cNo").checked=opts.norepeat;$("#cSnd").checked=opts.sound;$("#cMus").checked=opts.music;$("#cSfx").checked=opts.sfx;$("#ovS").classList.add("on")};
$("#bX").onclick=()=>$("#ovS").classList.remove("on");
$("#bSave").onclick=()=>{const n=$("#ta").value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,60);
 opts.norepeat=$("#cNo").checked;opts.sound=$("#cSnd").checked;opts.sfx=$("#cSfx").checked;{const m=$("#cMus").checked;if(m!==opts.music){opts.music=m;music(m)}label()}
 if(n.length&&n.join("|")!==names.join("|")){names=n;called.clear()}
 save();$("#ovS").classList.remove("on");$("#bGo").disabled=false;build()};
function init(){load();build();label();try{speechSynthesis.getVoices()}catch(e){}requestAnimationFrame(loop);addEventListener("pointerdown",()=>{ac();if(opts.music&&!mTimer)music(true)})}
requestAnimationFrame(init);
</script></body></html>
